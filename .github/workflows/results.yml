name: 更新比賽成績

on:
  schedule:
    # 臺北時間 11/24、11/25 早上 7:30 到下午 4:50，每 10 分鐘一次（GitHub 用 UTC，可能晚幾分鐘）
    - cron: "*/10 23 23,24 11 *"
    - cron: "*/10 0-8 24,25 11 *"
  workflow_dispatch:   # 可以在 Actions 頁面手動按「Run workflow」測試

permissions:
  contents: write

concurrency:
  group: results
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 抓成績
        run: python fetch_results.py
      - name: 有變動才上傳
        run: |
          git config user.name "results-bot"
          git config user.email "results-bot@users.noreply.github.com"
          git add results.json
          if git diff --cached --quiet; then
            echo "成績沒有變動"
          else
            git commit -m "更新成績 $(TZ=Asia/Taipei date '+%m/%d %H:%M')"
            git push
          fi
